# Local / offline run that mirrors a deployment: one container serving both the
# server and the built client. This is the mode for same-room, no-internet play
# (a phone hotspot) - everyone opens http://<this-machine-ip>:4040.
#
#   COPSE_BOOTSTRAP=some-secret docker compose up -d   ->   http://localhost:4040
# Then open http://<this-machine-ip>:4040/?bootstrap=some-secret once to create
# the first room; everyone else joins with the invite link you share.
services:
  copse:
    container_name: copse
    build: .
    restart: unless-stopped
    environment:
      PORT: 4040
      # The operator secret used once to mint the first room. Override on the CLI.
      COPSE_BOOTSTRAP: ${COPSE_BOOTSTRAP:-copse-admin}
      # Store the SQLite file on a named volume so messages survive a restart.
      COPSE_DB: /data/copse.db
    volumes:
      - copse-data:/data
    ports:
      - "4040:4040"
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:4040/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  copse-data:
