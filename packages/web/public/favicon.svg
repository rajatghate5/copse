  <path d="M23 33a6 6 0 0 1 6-6h20a6 6 0 0 1 6 6v9a6 6 0 0 1-6 6h-2l-7 5v-5H29a6 6 0 0 1-6-6z"
        fill="#eef1fb" stroke="#3a4f8c" stroke-width="3.5" stroke-linejoin="round"/>
</svg>
