<title>Copse Prototype</title>
<style>
  :root {
    --bg:#eef1ea; --panel:#fffefb; --panel-2:#f6f8f3; --ink:#1c2a21; --muted:#5d6b62; --faint:#8a978d;
    --line:#e2e7e1; --accent:#2f6b4f; --accent-ink:#22543d; --accent-soft:#e4efe6; --warm:#b8781f; --plum:#7d5a8c;
    --them:#eef2ea; --them-ink:#26332b; --me:#2f6b4f; --me-ink:#f2f8f3;
    --exp:#8a7a4a; --exp-bg:#f0ead9;
    --shadow:0 1px 2px rgba(20,40,30,.06), 0 12px 34px rgba(20,40,30,.10);
    --sans:"Hanken Grotesk", ui-sans-serif, system-ui, sans-serif;
    --serif:"Fraunces", Georgia, serif;
    --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  :root:not([data-theme="light"]) { @media (prefers-color-scheme: dark) {
    --bg:#0a0f0c; --panel:#141c17; --panel-2:#101713; --ink:#e4ede7; --muted:#9fb0a5; --faint:#7f9186;
    --line:#233029; --accent:#4c9a74; --accent-ink:#7fd6a8; --accent-soft:#153025; --warm:#c99a63; --plum:#b98fe0;
    --them:#18211c; --them-ink:#d4e0d8; --me:#3c7d5d; --me-ink:#f0f8f2; --exp:#c2ad76; --exp-bg:#241f12;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 14px 40px rgba(0,0,0,.5);
  }}
  :root[data-theme="dark"] {
    --bg:#0a0f0c; --panel:#141c17; --panel-2:#101713; --ink:#e4ede7; --muted:#9fb0a5; --faint:#7f9186;
    --line:#233029; --accent:#4c9a74; --accent-ink:#7fd6a8; --accent-soft:#153025; --warm:#c99a63; --plum:#b98fe0;
    --them:#18211c; --them-ink:#d4e0d8; --me:#3c7d5d; --me-ink:#f0f8f2; --exp:#c2ad76; --exp-bg:#241f12;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 14px 40px rgba(0,0,0,.5);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); line-height: 1.5; }
  button { font-family: inherit; cursor: pointer; }

  .frame { max-width: 1000px; margin: 0 auto; min-height: 100%; padding-inline: 16px; padding-block: 22px 30px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .brand { font-family: var(--serif); font-weight: 600; font-size: 22px; color: var(--accent-ink); }
  .brand .leaf { color: var(--accent); }
  .spacer { flex: 1; }
  .ghost-btn { background: var(--panel); border: 1px solid var(--line); color: var(--muted); border-radius: 999px; width: 38px; height: 38px; display: grid; place-items: center; box-shadow: var(--shadow); }
  .ghost-btn svg { width: 17px; height: 17px; }
  .ghost-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .stage { flex: 1; display: flex; }

  /* ---------- onboarding cards ---------- */
  .center { margin: auto; width: 100%; max-width: 460px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); padding: 30px 28px; }
  .hero-mark { width: 60px; height: 60px; border-radius: 18px; background: linear-gradient(150deg, #3c7d5d, #22543d); display: grid; place-items: center; margin-bottom: 20px; box-shadow: var(--shadow); }
  .hero-mark svg { width: 30px; height: 30px; color: #eaf5ee; }
  .card h1 { font-family: var(--serif); font-weight: 600; font-size: 30px; line-height: 1.05; margin: 0 0 8px; letter-spacing: -.01em; }
  .card p.sub { color: var(--muted); font-size: 15px; margin: 0 0 22px; }
  label { display: block; font-size: 12px; font-weight: 600; letter-spacing: .02em; color: var(--muted); margin: 0 0 6px; }
  .input { width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 15px; color: var(--ink); font-family: inherit; margin-bottom: 16px; }
  .input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
  .btn { width: 100%; background: var(--accent); color: #fff; border: 0; border-radius: 12px; padding: 13px; font-size: 15px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn:hover { filter: brightness(1.05); }
  .btn svg { width: 16px; height: 16px; }
  .btn.secondary { background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); }
  .note { font-size: 12.5px; color: var(--faint); margin-top: 14px; display: flex; gap: 7px; align-items: flex-start; }
  .note svg { width: 14px; height: 14px; flex: none; margin-top: 2px; color: var(--accent); }

  .pperr { color: var(--warm); font-size: 12.5px; margin: -6px 0 14px; font-weight: 600; }
  .pw-wrap { position: relative; margin-bottom: 16px; }
  .pw-wrap .input { margin-bottom: 0; padding-right: 46px; }
  .pw-eye { position: absolute; right: 7px; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; border: 0; background: transparent; color: var(--faint); display: grid; place-items: center; border-radius: 9px; }
  .pw-eye:hover { color: var(--accent); }
  .pw-eye:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .pw-eye svg { width: 18px; height: 18px; }

  /* ---------- chat app ---------- */
  .app { flex: 1; display: grid; grid-template-columns: 300px 1fr; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; box-shadow: var(--shadow); min-height: 0; }
  .roster { border-right: 1px solid var(--line); background: var(--panel-2); display: flex; flex-direction: column; min-height: 0; }
  .roster-top { padding: 16px 16px 10px; display: flex; align-items: center; justify-content: space-between; }
  .roster-top .r-title { font-family: var(--serif); font-weight: 600; font-size: 19px; color: var(--accent-ink); }
  .newbtn { background: var(--accent-soft); color: var(--accent-ink); border: 0; width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; }
  .newbtn svg { width: 16px; height: 16px; }
  .search { margin: 0 14px 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 13px; color: var(--faint); }
  .rlist { overflow-y: auto; padding: 6px 10px 12px; display: flex; flex-direction: column; gap: 2px; }
  .ritem { display: flex; gap: 11px; align-items: center; padding: 10px; border-radius: 13px; border: 0; background: transparent; text-align: left; width: 100%; }
  .ritem:hover { background: var(--panel); }
  .ritem.active { background: var(--accent-soft); }
  .av { width: 40px; height: 40px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 700; font-size: 14px; color: #fff; }
  .av.g { background: linear-gradient(150deg,#3c7d5d,#255c41); }
  .av.w { background: linear-gradient(150deg,#c98a4b,#a9682f); }
  .av.p { background: linear-gradient(150deg,#7d5a8c,#5e3f6b); }
  .av.b { background: linear-gradient(150deg,#4b7d8c,#2f5c6b); }
  .ri-main { min-width: 0; flex: 1 1 auto; display: flex; flex-direction: column; }
  .ri-name { display: block; font-size: 14px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .ri-prev { display: block; font-size: 12.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .ri-time { flex: 0 0 auto; align-self: flex-start; margin-top: 2px; font-size: 10.5px; color: var(--faint); font-family: var(--mono); white-space: nowrap; }

  .thread { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .thread-head { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--line); }
  .back { display: none; background: transparent; border: 0; color: var(--muted); width: 32px; height: 32px; border-radius: 8px; }
  .back svg { width: 20px; height: 20px; }
  .th-name { font-family: var(--serif); font-weight: 600; font-size: 16px; color: var(--ink); }
  .th-sub { font-size: 11.5px; color: var(--faint); }
  .verified { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 5px 11px; border-radius: 999px; border: 0; }
  .verified svg { width: 13px; height: 13px; }

  .stream { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 9px; }
  .day { align-self: center; font-size: 10.5px; color: var(--faint); font-family: var(--mono); text-transform: uppercase; letter-spacing: .08em; margin: 4px 0; }
  .bubble { max-width: 72%; min-width: 0; padding: 9px 13px; border-radius: 17px; font-size: 14px; line-height: 1.4; animation: pop .18s ease; overflow-wrap: anywhere; word-break: break-word; }
  .bubble .t { overflow-wrap: anywhere; }
  @keyframes pop { from { transform: translateY(4px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .bubble { animation: none; } }
  .them { align-self: flex-start; background: var(--them); color: var(--them-ink); border-bottom-left-radius: 5px; }
  .me { align-self: flex-end; background: var(--me); color: var(--me-ink); border-bottom-right-radius: 5px; }
  .sender { font-size: 11px; font-weight: 700; margin-bottom: 3px; color: var(--warm); font-family: var(--sans); }
  .typing-b { display: inline-flex; align-items: center; gap: 4px; padding: 12px 15px; }
  .typing-b .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--them-ink); opacity: .45; animation: typedot 1.2s infinite ease-in-out; }
  .typing-b .dot:nth-child(2) { animation-delay: .16s; }
  .typing-b .dot:nth-child(3) { animation-delay: .32s; }
  @keyframes typedot { 0%, 60%, 100% { transform: translateY(0); opacity: .35; } 30% { transform: translateY(-4px); opacity: .9; } }
  @media (prefers-reduced-motion: reduce) { .typing-b .dot { animation: none; } }
  .meta { display: flex; align-items: center; gap: 7px; margin-top: 4px; }
  .ts { font-size: 10px; opacity: .75; font-family: var(--mono); }
  .exp { font-size: 9.5px; font-family: var(--mono); padding: 1px 6px; border-radius: 999px; background: var(--exp-bg); color: var(--exp); }
  .status { width: 14px; height: 14px; opacity: .8; }
  .status svg { width: 100%; height: 100%; }

  .composer { display: flex; gap: 8px; align-items: center; padding: 12px 14px; border-top: 1px solid var(--line); }
  .attach { width: 40px; height: 40px; border-radius: 50%; background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); display: grid; place-items: center; flex: none; }
  .attach:hover { color: var(--accent); border-color: var(--accent); }
  .attach svg { width: 18px; height: 18px; }
  .attach:focus-visible, .send:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .composer input[type="text"], .composer input:not([type]) { flex: 1; background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 11px 16px; font-size: 14px; color: var(--ink); font-family: inherit; }
  .file-att { display: inline-flex; align-items: center; gap: 10px; }
  .file-att > svg:first-child { width: 22px; height: 22px; flex: none; opacity: .85; }
  .file-att > svg:last-child { width: 16px; height: 16px; flex: none; opacity: .7; }
  .file-meta { display: flex; flex-direction: column; min-width: 0; }
  .file-name { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
  .file-size { font-size: 10.5px; font-family: var(--mono); opacity: .75; }
  .composer input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
  .send { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); border: 0; display: grid; place-items: center; flex: none; }
  .send svg { width: 17px; height: 17px; color: #fff; }
  .lock-strip { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 6px; font-size: 10.5px; color: var(--faint); background: var(--panel-2); font-family: var(--mono); }
  .lock-strip svg { width: 11px; height: 11px; }

  /* sheet / modal */
  .scrim { position: fixed; inset: 0; background: rgba(10,20,15,.45); display: grid; place-items: center; padding: 16px; z-index: 20; }
  .sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); padding: 26px; max-width: 400px; width: 100%; text-align: center; }
  .sheet .shield { width: 54px; height: 54px; border-radius: 16px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; margin: 0 auto 14px; }
  .sheet .shield svg { width: 26px; height: 26px; }
  .sheet h2 { font-family: var(--serif); font-weight: 600; font-size: 22px; margin: 0 0 6px; }
  .sheet p { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  .safety-num { font-family: var(--mono); font-size: 16px; letter-spacing: .04em; color: var(--ink); background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 16px; line-height: 1.8; margin-bottom: 18px; word-spacing: 4px; }

  @media (max-width: 620px) {
    .app { grid-template-columns: 1fr; }
    .app[data-view="thread"] .roster { display: none; }
    .app[data-view="list"] .thread { display: none; }
    .back { display: grid; }
    .bubble { max-width: 82%; }
  }
</style>

<div class="frame">
  <div class="topbar">
    <span class="brand"><span class="leaf">❧</span> Copse</span>
    <span class="spacer"></span>
    <button class="ghost-btn" id="themeBtn" aria-label="Toggle theme"></button>
  </div>
  <div class="stage" id="stage"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/feather-icons/4.29.2/feather.min.js"></script>
<script>
(function () {
  var I = {
    lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
    shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3l7 3v5c0 5-3.5 8-7 9-3.5-1-7-4-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg>',
    arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>',
    plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    chevL:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
    key:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.5 12.5L20 3M16 7l3 3M13 10l3 3"/></svg>',
    sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
    check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
    check2:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L7 17l-4-4M22 8l-8 8"/></svg>',
    clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    paperclip:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9.2 9.2a4 4 0 0 1-5.7-5.7L15 3a2.6 2.6 0 0 1 3.7 3.7L9.5 15.9a1.3 1.3 0 0 1-1.8-1.8l8.1-8.1"/></svg>',
    file:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>',
    download:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 11l5 5 5-5M5 21h14"/></svg>',
    eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>',
    eyeOff:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7c2.2 0 4.1.7 5.7 1.6M22 12s-3.5 7-10 7c-2.2 0-4.1-.7-5.7-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2M4 4l16 16"/></svg>'
  };

  var CONVS = {
    four: { name:'The Four', sub:'Priya, Arjun, Rajat & you', av:'g', label:'4', group:true, msgs:[
      { day:'Today' },
      { from:'Priya', text:'did the hotspot trick actually work on the train?', ts:'18:02' },
      { me:true, text:'yep. no wifi, no signal even. all four of us local 🙌', ts:'18:03', status:'read' },
      { from:'Arjun', text:'wait so nothing touched the internet?', ts:'18:03' },
      { me:true, text:'nothing. and even online the server only sees gibberish', ts:'18:04', status:'read' },
      { from:'Priya', text:'on my way, 5 min', ts:'18:05' }
    ]},
    arjun: { name:'Arjun', sub:'last seen 2m ago', av:'w', label:'AK', msgs:[
      { day:'Today' },
      { from:'Arjun', text:'sent you the file 🔒', ts:'16:40' },
      { me:true, text:'got it, decrypts fine', ts:'16:44', status:'read' }
    ]},
    rajat: { name:'Rajat', sub:'that\'s you — notes to self', av:'p', label:'RG', msgs:[
      { day:'Yesterday' },
      { me:true, text:'remember to verify Meera\'s safety number', ts:'22:10', status:'read' }
    ]},
    meera: { name:'Meera', sub:'key exchanged · unverified', av:'b', label:'MS', msgs:[
      { day:'Mon' },
      { from:'Meera', text:'who\'s in for the weekend plan?', ts:'09:12', exp:'1d left' }
    ]}
  };

  var state = { screen:'welcome', conv:'four', view:'list', name:'', theme:'system', modal:false };
  var stage = document.getElementById('stage');
  var themeBtn = document.getElementById('themeBtn');

  function applyTheme() {
    var root = document.documentElement;
    if (state.theme === 'system') root.removeAttribute('data-theme');
    else root.setAttribute('data-theme', state.theme);
    var dark = state.theme === 'dark' || (state.theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    themeBtn.innerHTML = dark ? I.sun : I.moon;
  }
  themeBtn.addEventListener('click', function () {
    state.theme = (state.theme === 'dark') ? 'light' : 'dark';
    applyTheme();
  });

  function statusIcon(s) {
    if (s === 'pending') return '<span class="status" style="color:var(--faint)">' + I.clock + '</span>';
    if (s === 'sent') return '<span class="status" style="color:var(--me-ink)">' + I.check + '</span>';
    if (s === 'read') return '<span class="status" style="color:#8fd6b0">' + I.check2 + '</span>';
    return '';
  }

  function renderStream(conv) {
    var html = conv.msgs.map(function (m) {
      if (m.day) return '<div class="day">' + m.day + '</div>';
      var meta = '<div class="meta"><span class="ts">' + m.ts + '</span>'
        + (m.exp ? '<span class="exp">' + m.exp + '</span>' : '')
        + (m.me ? statusIcon(m.status || 'sent') : '') + '</div>';
      var sender = (!m.me && conv.group) ? '<div class="sender">' + m.from + '</div>' : '';
      var body = m.file
        ? '<span class="file-att">' + I.file + '<span class="file-meta"><span class="file-name">' + m.file.name
            + '</span><span class="file-size">' + m.file.size + ' · encrypted</span></span>' + I.download + '</span>'
        : '<span class="t">' + m.text + '</span>';
      return '<div class="bubble ' + (m.me ? 'me' : 'them') + '">' + sender + body + meta + '</div>';
    }).join('');
    if (state.typing && state.typing.conv === state.conv) {
      var s = conv.group ? '<div class="sender">' + state.typing.name + '</div>' : '';
      html += '<div class="bubble them typing-b" style="flex-direction:column;align-items:flex-start">' + s
        + '<span style="display:inline-flex;gap:4px"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span></div>';
    }
    return html;
  }

  function rosterItem(id) {
    var c = CONVS[id];
    var last = c.msgs[c.msgs.length - 1];
    var prev = last.day ? '—' : (last.me ? 'You: ' : '') + last.text;
    return '<button class="ritem ' + (state.conv === id ? 'active' : '') + '" data-conv="' + id + '">'
      + '<span class="av ' + c.av + '">' + c.label + '</span>'
      + '<span class="ri-main"><span class="ri-name">' + c.name + '</span><span class="ri-prev">' + prev + '</span></span>'
      + '<span class="ri-time">' + (last.ts || '') + '</span></button>';
  }

  function renderApp() {
    var c = CONVS[state.conv];
    stage.innerHTML =
      '<div class="app" data-view="' + state.view + '">' +
        '<div class="roster">' +
          '<div class="roster-top"><span class="r-title">Chats</span><button class="newbtn" aria-label="New chat">' + I.plus + '</button></div>' +
          '<div class="search">Search…</div>' +
          '<div class="rlist">' + Object.keys(CONVS).map(rosterItem).join('') + '</div>' +
        '</div>' +
        '<div class="thread">' +
          '<div class="thread-head">' +
            '<button class="back" aria-label="Back">' + I.chevL + '</button>' +
            '<span class="av ' + c.av + '" style="width:36px;height:36px">' + c.label + '</span>' +
            '<span><span class="th-name">' + c.name + '</span><br><span class="th-sub">' + c.sub + '</span></span>' +
            '<button class="verified" id="verifyBtn">' + I.shield + (state.conv === 'meera' ? 'Verify' : 'Verified') + '</button>' +
          '</div>' +
          '<div class="stream" id="stream">' + renderStream(c) + '</div>' +
          '<div class="lock-strip">' + I.lock + 'End-to-end encrypted · disappears after 7 days</div>' +
          '<div class="composer">' +
            '<button class="attach" id="attachBtn" aria-label="Attach a file">' + I.paperclip + '</button>' +
            '<input type="file" id="fileEl" hidden />' +
            '<input id="msgInput" placeholder="Message ' + c.name + '…" autocomplete="off" />' +
            '<button class="send" id="sendBtn" aria-label="Send">' + I.arrow + '</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    if (window.feather) window.feather.replace();
    var stream = document.getElementById('stream');
    stream.scrollTop = stream.scrollHeight;
    wireApp();
    if (!state.demoed) { state.demoed = true; scheduleEntryDemo(); }
  }

  // Show a typing indicator right after entering, then land a reply, so the
  // typing animation is visible without the user having to send first.
  function scheduleEntryDemo() {
    setTimeout(function () {
      if (state.screen !== 'app') return;
      state.typing = { conv: 'four', name: 'Priya' };
      renderApp();
    }, 1000);
    setTimeout(function () {
      if (state.screen !== 'app') return;
      state.typing = null;
      CONVS.four.msgs.push({ from: 'Priya', text: 'perfect — bringing snacks 🍇', ts: 'now' });
      renderApp();
    }, 3400);
  }

  function wireApp() {
    Array.prototype.forEach.call(document.querySelectorAll('.ritem'), function (b) {
      b.addEventListener('click', function () { state.conv = b.dataset.conv; state.view = 'thread'; renderApp(); });
    });
    var back = document.querySelector('.back');
    if (back) back.addEventListener('click', function () { state.view = 'list'; renderApp(); });
    var verify = document.getElementById('verifyBtn');
    if (verify) verify.addEventListener('click', openSafety);

    var input = document.getElementById('msgInput');
    var send = document.getElementById('sendBtn');
    var attach = document.getElementById('attachBtn');
    var fileEl = document.getElementById('fileEl');

    var REPLIES = {
      four:  { name:'Priya', text:'nice — see you all there 🌿' },
      arjun: { name:'Arjun', text:'perfect, thanks!' },
      meera: { name:'Meera', text:'sounds good' }
    };

    function afterSend(convId) {
      // Optimistic ACK: pending -> sent -> read, like the real seq-based flow,
      // then the other side types and replies (skipped for notes-to-self).
      var reply = REPLIES[convId];
      if (!reply) return;
      setTimeout(function () { state.typing = { conv: convId, name: reply.name }; renderApp(); }, 1400);
      setTimeout(function () {
        state.typing = null;
        CONVS[convId].msgs.push({ from: reply.name, text: reply.text, ts:'now' });
        renderApp();
      }, 3100);
    }

    function pushMine(msg, convId) {
      CONVS[convId].msgs.push(msg);
      renderApp();
      var i = document.getElementById('msgInput'); if (i) i.focus();
      setTimeout(function () { msg.status = 'sent'; renderApp(); }, 500);
      setTimeout(function () { msg.status = 'read'; renderApp(); }, 1300);
      afterSend(convId);
    }

    function doSend() {
      var text = input.value.trim();
      if (!text) return;
      var convId = state.conv;
      input.value = '';
      pushMine({ me:true, text:text, ts:'now', status:'pending' }, convId);
    }
    send.addEventListener('click', doSend);
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') doSend(); });

    attach.addEventListener('click', function () { fileEl.click(); });
    fileEl.addEventListener('change', function () {
      var f = fileEl.files && fileEl.files[0];
      if (!f) return;
      var convId = state.conv;
      var kb = Math.max(1, Math.round(f.size / 1024));
      var size = kb > 1024 ? (kb / 1024).toFixed(1) + ' MB' : kb + ' KB';
      fileEl.value = '';
      pushMine({ me:true, file:{ name:f.name, size:size }, ts:'now', status:'pending' }, convId);
    });
    input.focus();
  }

  function openSafety() {
    state.modal = true;
    var scrim = document.createElement('div');
    scrim.className = 'scrim';
    scrim.innerHTML =
      '<div class="sheet">' +
        '<div class="shield">' + I.shield + '</div>' +
        '<h2>Safety number</h2>' +
        '<p>Read this aloud with ' + CONVS[state.conv].name + '. If it matches on both screens, no one is listening in.</p>' +
        '<div class="safety-num">44719 02286 11038<br>82741 59033 07641<br>29155 60847 33920</div>' +
        '<button class="btn" id="closeSheet">' + I.check + ' It matches</button>' +
      '</div>';
    scrim.addEventListener('click', function (e) { if (e.target === scrim) close(); });
    document.body.appendChild(scrim);
    document.getElementById('closeSheet').addEventListener('click', close);
    if (window.feather) window.feather.replace();
    function close() { scrim.remove(); state.modal = false; }
  }

  function renderWelcome() {
    stage.innerHTML =
      '<div class="center"><div class="card">' +
        '<div class="hero-mark">' + I.lock + '</div>' +
        '<h1>A private copse<br>for the four of you</h1>' +
        '<p class="sub">End-to-end encrypted. No phone number. Messages disappear after seven days. Enter an invite to begin.</p>' +
        '<label for="inv">Invite code</label>' +
        '<input class="input" id="inv" placeholder="copse-xxxx" value="copse-4evr" />' +
        '<div id="inverr" class="pperr" hidden></div>' +
        '<label for="nm">Your name</label>' +
        '<input class="input" id="nm" placeholder="What should friends see?" value="Rajat" />' +
        '<button class="btn" id="go">' + I.key + ' Create my account</button>' +
        '<p class="note">' + I.lock + '<span>Your keys are generated on this device and never sent anywhere. Only your public keys leave.</span></p>' +
      '</div></div>';
    if (window.feather) window.feather.replace();
    document.getElementById('go').addEventListener('click', function () {
      var inv = document.getElementById('inv').value.trim();
      var err = document.getElementById('inverr');
      // The invite is the gate. The real server checks it against COPSE_INVITE
      // and returns 403 on a mismatch; here we mirror that with the demo code.
      if (inv !== 'copse-4evr') {
        err.textContent = 'That invite code isn\'t valid. Ask whoever runs this Copse for one.';
        err.hidden = false;
        return;
      }
      state.name = document.getElementById('nm').value.trim() || 'you';
      state.screen = 'phrase'; render();
    });
  }

  function renderPhrase() {
    stage.innerHTML =
      '<div class="center"><div class="card">' +
        '<h1>Set your passphrase</h1>' +
        '<p class="sub">This unlocks Copse on this device and any other you sign in on. Your account is encrypted with it, and only the <b>locked</b> version is ever stored — so choose something only you know.</p>' +
        '<label for="pp">Passphrase</label>' +
        '<div class="pw-wrap"><input class="input" id="pp" type="password" placeholder="At least 8 characters" autocomplete="new-password" />' +
          '<button class="pw-eye" type="button" data-target="pp" aria-label="Show passphrase" aria-pressed="false">' + I.eye + '</button></div>' +
        '<label for="pp2">Confirm passphrase</label>' +
        '<div class="pw-wrap"><input class="input" id="pp2" type="password" placeholder="Type it again" autocomplete="new-password" />' +
          '<button class="pw-eye" type="button" data-target="pp2" aria-label="Show passphrase" aria-pressed="false">' + I.eye + '</button></div>' +
        '<div id="pperr" class="pperr" hidden></div>' +
        '<button class="btn" id="done">' + I.lock + ' Create account</button>' +
        '<button class="btn secondary" id="back" style="margin-top:10px">Back</button>' +
        '<p class="note">' + I.key + '<span>No phrase to write down. Forget the passphrase and messages can\'t be recovered — that\'s the trade for a server that can never read them.</span></p>' +
      '</div></div>';
    if (window.feather) window.feather.replace();
    var pp = document.getElementById('pp'), pp2 = document.getElementById('pp2'), err = document.getElementById('pperr');
    Array.prototype.forEach.call(document.querySelectorAll('.pw-eye'), function (eye) {
      eye.addEventListener('click', function () {
        var field = document.getElementById(eye.dataset.target);
        var show = field.type === 'password';
        field.type = show ? 'text' : 'password';
        eye.innerHTML = show ? I.eyeOff : I.eye;
        eye.setAttribute('aria-pressed', String(show));
        eye.setAttribute('aria-label', show ? 'Hide passphrase' : 'Show passphrase');
        field.focus();
      });
    });
    function fail(msg) { err.textContent = msg; err.hidden = false; }
    document.getElementById('done').addEventListener('click', function () {
      var a = pp.value, b = pp2.value;
      if (a.length < 8) return fail('Use at least 8 characters.');
      if (a !== b) return fail('The two passphrases don\'t match.');
      state.screen = 'app'; state.view = 'list'; render();
    });
    pp2.addEventListener('keydown', function (e) { if (e.key === 'Enter') document.getElementById('done').click(); });
    document.getElementById('back').addEventListener('click', function () { state.screen = 'welcome'; render(); });
    pp.focus();
  }

  function render() {
    if (state.screen === 'welcome') renderWelcome();
    else if (state.screen === 'phrase') renderPhrase();
    else renderApp();
  }

  applyTheme();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
  render();
})();
</script>
